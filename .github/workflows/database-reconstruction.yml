name: Verify database-date reconstruction
on: workflow_dispatch
permissions:
  contents: write
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-liberation
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Download source bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --pattern Source-metadata.zip --pattern Extraction-caches.zip --dir "$RUNNER_TEMP/bundles"
          unzip -q "$RUNNER_TEMP/bundles/Source-metadata.zip" -d "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/bundles/Extraction-caches.zip" -d "$RUNNER_TEMP/caches"
      - run: python scripts/reproduce_database.py --source "$RUNNER_TEMP/source" --cache-dir "$RUNNER_TEMP/caches" --output "$RUNNER_TEMP/database"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-reconstruction
          path: |
            ${{ runner.temp }}/database/Stages.json
            ${{ runner.temp }}/database/logs/
            ${{ runner.temp }}/database/rebuilt/Gallery/
            ${{ runner.temp }}/database/rebuilt/Supplementary-Tables/
            ${{ runner.temp }}/database/rebuilt/Arsenal/H4-H7-databases-storage/H4-dataset-database-date.csv.gz
            ${{ runner.temp }}/database/rebuilt/Arsenal/H11-clocks/Summary.json
