name: Rebuild complete analysis package
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release containing Source-metadata.zip and Extraction-caches.zip
        default: v0.1.0
        required: true
permissions:
  # Required to read this repository's draft release; this workflow only downloads.
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-liberation
      - run: python -m unittest discover -s scripts -p test_reconstruction.py
      - name: Download frozen source bundles
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_RELEASE: ${{ inputs.release }}
        run: |
          gh release download "$CACHE_RELEASE" --pattern Source-metadata.zip --pattern Extraction-caches.zip --dir "$RUNNER_TEMP/bundles"
          unzip -q "$RUNNER_TEMP/bundles/Source-metadata.zip" -d "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/bundles/Extraction-caches.zip" -d "$RUNNER_TEMP/caches"
      - run: python scripts/reproduce_all.py --source "$RUNNER_TEMP/source" --cache-dir "$RUNNER_TEMP/caches" --output "$RUNNER_TEMP/reconstruction"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-reconstruction
          path: |
            ${{ runner.temp }}/reconstruction/Stages.json
            ${{ runner.temp }}/reconstruction/logs/
            ${{ runner.temp }}/reconstruction/rebuilt/*validation.json
            ${{ runner.temp }}/reconstruction/rebuilt/Gallery/data/
            ${{ runner.temp }}/reconstruction/rebuilt/Journal-figures/
            ${{ runner.temp }}/reconstruction/rebuilt/Supplementary-Tables/
            ${{ runner.temp }}/reconstruction/late/Validation.json
            ${{ runner.temp }}/reconstruction/late/Model-diagnostics.json
