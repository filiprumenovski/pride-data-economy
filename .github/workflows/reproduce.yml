name: Verify released analyses
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python scripts/release_early.py validate --data-dir data/early --output-dir results/early
      - run: python scripts/release_late.py validate --data data/late --output results/late
      - run: python scripts/release_late_support.py --data data/late --output results/late-support
      - run: python scripts/release_clocks.py --data data/late --output results/clocks
      - run: python -m unittest discover -s work/stack-and-reuse -p test_journal_layout.py
